name: Build iStoreOS

on:
  push:
    branches: [ istoreos-24.10 ]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc g++ binutils bzip2 \
            flex perl python3 python3-pip git subversion libncurses-dev \
            libz-dev libssl-dev libelf-dev autoconf automake libtool \
            make cmake ninja-build gettext pkg-config usign ucert

      - name: Clone iStoreOS source
        run: |
          git clone https://github.com/cam350/istoreos.git
          cd istoreos
          git checkout istoreos-24.10  # 推荐稳定分支

      - name: Prepare feeds
        run: |
          cd istoreos
          cp ../diy-part1.sh .
          bash diy-part1.sh

      - name: Update & install feeds
        run: |
          cd istoreos
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config
        run: |
          cd istoreos
          cp ../.config .
          make defconfig  # 补全配置

      - name: Customize
        run: |
          cd istoreos
          cp ../diy-part2.sh .
          bash diy-part2.sh

      - name: Compile
        run: |
          cd istoreos
          make -j$(nproc) V=s  # V=s 输出详细日志，便于排错

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-firmware
          path: istoreos/bin/targets/**/*
